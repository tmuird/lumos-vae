[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lumos-flim"
version = "0.1.0"
description = "Physics-informed VAE for fluorescence lifetime imaging (TCSPC FLIM), adapted from LUMOS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch>=2.0",
    "pytorch-lightning>=2.0",
    "xarray",
    "zarr",
    "tifffile",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
lumos-flim-train = "lumos_flim.train:main"

[tool.setuptools.packages.find]
where = ["src"]
